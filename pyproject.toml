[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-reading"
version = "0.1.0"
description = "AI 论文读图理解 CLI 工具"
readme = "文档/AI论文读图讲解小工具-技术路线.md"
requires-python = ">=3.9"
dependencies = [
  "pydantic>=2,<3",
  "typer>=0.19,<1",
  "httpx>=0.27,<1",
  "huggingface-hub>=0.25,<1",
  "PyYAML>=6,<7",
  "Pillow>=10,<12",
  "PyMuPDF>=1.24,<2",
  "doclayout-yolo>=0.0.4,<1",
  "reportlab>=4,<5",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "python-multipart>=0.0.12,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
paper-read = "paper_reading.cli:app"
paper-read-web = "paper_reading.web.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paper_reading = ["web/static/*"]
